name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip project if needed
      run: |
        if [ ! -f "gradlew" ] && [ -f "CalculatorVault_fixed.zip" ]; then
          unzip -o CalculatorVault_fixed.zip
        fi

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x CalculatorVault/gradlew

    - name: Build with Gradle
      working-directory: CalculatorVault
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: CalculatorVault/app/build/outputs/apk/debug/app-debug.apk
